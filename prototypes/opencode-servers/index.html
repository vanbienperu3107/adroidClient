<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototype: OpenCode servers và sessions</title>
<link rel="icon" href="data:,">
<!--
  Prototype tĩnh, cùng hướng thiết kế với ../opencode-chat (hướng A "Bàn điều khiển rêu").
  Bám theo code thật tại commit 2eb278c:
    - OpenCodeServerScreens.kt: displayName, baseUrl, Projects/Edit/Delete, form Name / HTTPS URL / Basic username / Password, Test / Save.
    - OpenCodeModels.kt: chỉ có AuthMode BASIC; 13 OpenCodeConnectionState.
    - OpenCodeBrowseScreen.kt: project theo directory; session có status, updatedAt, pending count, Rename/Delete
      (Delete xoá trên server, ảnh hưởng mọi thiết bị), "Cached data — not synchronized", "Authentication required".
  Dữ liệu giả lập, không gọi mạng, không chứa credential.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #17202B; --slate: #5A6776; --line: #D9DED8; --paper: #F2F4F1; --sheet: #FFFFFF;
    --agent: #3D55C8; --agent-soft: #E6E9F8; --signal: #E9A23B; --signal-soft: #FCF1DE; --signal-ink: #8A5A10;
    --ok: #256B48; --ok-soft: #E3F1E9; --bad: #B2453A; --bad-soft: #F7E4E1;
    --ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --code: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: var(--ui); color: var(--ink); background: #C9CFC8; -webkit-font-smoothing: antialiased;
    min-height: 100vh; display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; align-items: flex-start; padding: 24px;
  }
  code, .mono { font-family: var(--code); font-variant-ligatures: none; }
  :focus-visible { outline: 3px solid var(--agent); outline-offset: 2px; border-radius: 6px; }
  .device {
    position: relative; width: 390px; height: min(844px, calc(100vh - 48px)); min-height: 640px;
    background: var(--paper); border-radius: 36px; overflow: hidden;
    box-shadow: 0 0 0 10px #1E252C, 0 30px 60px -20px rgba(23, 32, 43, .55);
    display: flex; flex-direction: column;
  }
  .caption { position: absolute; top: -9999px; }
  @media (max-width: 480px) {
    body { padding: 0; gap: 0; background: var(--paper); }
    .device { width: 100%; height: 100dvh; min-height: 0; border-radius: 0; box-shadow: none; border-bottom: 8px solid #C9CFC8; }
  }

  .topbar { background: var(--sheet); border-bottom: 1px solid var(--line); padding: 12px 8px 12px 4px; display: flex; align-items: center; gap: 4px; }
  .topbar h1 { margin: 0 0 0 12px; font-size: 20px; line-height: 26px; font-weight: 600; flex: 1; }
  .topbar .sub { display: block; font-size: 13px; line-height: 18px; color: var(--slate); font-weight: 400; }
  .icon-btn { width: 48px; height: 48px; border: 0; background: transparent; border-radius: 24px; display: grid; place-items: center; color: var(--ink); cursor: pointer; flex: none; }
  .icon-btn:hover { background: var(--paper); }

  .scroll { flex: 1; overflow-y: auto; padding: 8px 16px 96px; }

  /* Server list: mỗi server là một hàng, trạng thái kết nối nằm ngay dưới tên */
  .servers { list-style: none; margin: 0; padding: 0; }
  .server { display: grid; grid-template-columns: 1fr 48px; align-items: center; border-bottom: 1px solid var(--line); }
  .server:last-child { border-bottom: 0; }
  .server-main {
    display: block; text-align: left; border: 0; background: transparent; padding: 16px 0; cursor: pointer; color: inherit; font: inherit;
    min-height: 48px;
  }
  .server-main .name { font-size: 17px; line-height: 22px; font-weight: 600; display: block; }
  .server-main .url { font-family: var(--code); font-size: 12.5px; line-height: 18px; color: var(--slate); display: block; margin-top: 2px; overflow-wrap: anywhere; }
  .state { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; line-height: 18px; font-weight: 500; padding: 3px 10px 3px 8px; border-radius: 12px; }
  .state::before { content: ""; width: 8px; height: 8px; border-radius: 4px; background: currentColor; }
  .state.ok { color: var(--ok); background: var(--ok-soft); }
  .state.warn { color: var(--signal-ink); background: var(--signal-soft); }
  .state.bad { color: var(--bad); background: var(--bad-soft); }
  .state .ver { font-family: var(--code); font-size: 12px; font-weight: 400; }

  .note { font-size: 13px; line-height: 19px; color: var(--slate); margin: 16px 0 0; max-width: 34em; }

  .fab {
    position: absolute; right: 16px; bottom: 20px; height: 56px; padding: 0 22px 0 18px; border: 0; border-radius: 16px;
    background: var(--agent); color: #fff; font: 600 15px var(--ui); display: flex; align-items: center; gap: 8px; cursor: pointer;
    box-shadow: 0 8px 20px -8px rgba(61, 85, 200, .7);
  }

  /* Menu hành động của một server (bottom sheet) */
  .scrim { position: absolute; inset: 0; background: rgba(23, 32, 43, .38); }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--sheet); border-radius: 24px 24px 0 0; padding: 10px 8px 16px; }
  .grip { width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 8px; }
  .sheet h2 { margin: 4px 16px 4px; font-size: 17px; font-weight: 600; }
  .sheet p.sheet-sub { margin: 0 16px 8px; font-size: 13px; color: var(--slate); }
  .menu { list-style: none; margin: 0; padding: 0; }
  .menu button { width: 100%; min-height: 52px; border: 0; background: transparent; text-align: left; padding: 0 16px; font: 500 16px var(--ui); color: var(--ink); cursor: pointer; border-radius: 12px; }
  .menu button:hover { background: var(--paper); }
  .menu .danger { color: var(--bad); }
  .confirm { padding: 4px 16px 0; }
  .confirm p { margin: 0 0 16px; font-size: 14px; line-height: 21px; color: var(--slate); }
  .row-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .btn { height: 48px; padding: 0 20px; border-radius: 12px; font: 600 15px var(--ui); cursor: pointer; }
  .btn.quiet { border: 1.5px solid var(--line); background: var(--sheet); color: var(--ink); }
  .btn.danger { border: 0; background: var(--bad); color: #fff; }
  .btn.primary { border: 0; background: var(--agent); color: #fff; }

  /* Session list */
  .projects { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; background: var(--sheet); border-bottom: 1px solid var(--line); scrollbar-width: none; }
  .projects button {
    flex: none; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1.5px solid var(--line); background: var(--sheet);
    font: 500 13px var(--code); font-variant-ligatures: none; color: var(--ink); cursor: pointer;
  }
  .projects button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #F2F4F1; }
  .stale { display: flex; gap: 10px; align-items: center; padding: 10px 16px; background: var(--signal-soft); color: var(--signal-ink); font-size: 14px; }
  .stale button { margin-left: auto; min-height: 40px; border: 0; background: transparent; color: var(--signal-ink); font: 600 14px var(--ui); cursor: pointer; text-decoration: underline; }

  .sessions { list-style: none; margin: 0; padding: 0; }
  .session { display: grid; grid-template-columns: 1fr 48px; align-items: start; border-bottom: 1px solid var(--line); }
  .session-main { display: block; text-align: left; border: 0; background: transparent; padding: 14px 0; cursor: pointer; color: inherit; font: inherit; }
  .session-main .t { font-size: 16px; line-height: 22px; font-weight: 600; display: block; }
  .session-main .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 6px; font-size: 13px; line-height: 18px; color: var(--slate); align-items: center; }
  .agent-state { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
  .agent-state::before { content: ""; width: 8px; height: 8px; border-radius: 4px; background: currentColor; }
  .agent-state.busy { color: var(--agent); }
  .agent-state.idle { color: var(--slate); }
  .agent-state.retry { color: var(--bad); }
  .pending { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--signal-ink); background: var(--signal-soft); padding: 2px 10px; border-radius: 12px; }
  .session .icon-btn { margin-top: 6px; }
  .more-sessions { width: 100%; min-height: 48px; margin-top: 8px; border: 1.5px dashed var(--line); border-radius: 12px; background: transparent; font: 500 14px var(--ui); color: var(--agent); cursor: pointer; }

  .toast { position: absolute; left: 16px; right: 16px; bottom: 88px; background: var(--ink); color: #F2F4F1; padding: 12px 16px; border-radius: 12px; font-size: 14px; display: none; }
  .toast.show { display: block; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: no-preference) { .sheet { animation: rise .32s cubic-bezier(.2, .8, .2, 1) both; } }
  @keyframes rise { from { transform: translateY(100%); } to { transform: none; } }
</style>
</head>
<body>

<!-- Màn 1: danh sách server -->
<main class="device" id="servers-screen" aria-labelledby="servers-title">
  <header class="topbar">
    <button class="icon-btn" type="button" aria-label="Quay lại">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 id="servers-title">Máy chủ OpenCode</h1>
  </header>
  <div class="scroll">
    <ul class="servers">
      <li class="server">
        <button class="server-main" type="button" data-open-projects>
          <span class="name">Máy công ty</span>
          <span class="url">https://devbox.tail3c9a.ts.net</span>
          <span class="state ok">Đã kết nối <span class="ver">v1.2.10</span></span>
        </button>
        <button class="icon-btn" type="button" aria-label="Tùy chọn cho Máy công ty" data-menu="Máy công ty">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
        </button>
      </li>
      <li class="server">
        <button class="server-main" type="button">
          <span class="name">Laptop ở nhà</span>
          <span class="url">https://homelab.tail3c9a.ts.net</span>
          <span class="state warn">Cần đăng nhập lại</span>
        </button>
        <button class="icon-btn" type="button" aria-label="Tùy chọn cho Laptop ở nhà" data-menu="Laptop ở nhà">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
        </button>
      </li>
      <li class="server">
        <button class="server-main" type="button">
          <span class="name">Build server</span>
          <span class="url">https://ci-runner.tail3c9a.ts.net</span>
          <span class="state bad">Không kết nối được</span>
        </button>
        <button class="icon-btn" type="button" aria-label="Tùy chọn cho Build server" data-menu="Build server">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
        </button>
      </li>
    </ul>
    <p class="note">Mật khẩu được lưu trong Android Keystore của máy này và không được sao lưu.</p>
  </div>
  <button class="fab" type="button">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    Thêm máy chủ
  </button>

  <div id="server-menu" hidden>
    <div class="scrim" data-close></div>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="menu-title">
      <div class="grip" aria-hidden="true"></div>
      <div id="menu-list">
        <h2 id="menu-title">Máy công ty</h2>
        <ul class="menu">
          <li><button type="button" data-close>Kiểm tra kết nối</button></li>
          <li><button type="button" data-close>Sửa thông tin đăng nhập</button></li>
          <li><button type="button" class="danger" id="ask-delete">Xóa máy chủ khỏi điện thoại</button></li>
        </ul>
      </div>
      <div id="menu-confirm" class="confirm" hidden>
        <h2 id="confirm-title" style="margin:4px 0 8px">Xóa “Máy công ty”?</h2>
        <p>Điện thoại sẽ quên địa chỉ và mật khẩu của máy chủ này. Session trên máy chủ không bị ảnh hưởng.</p>
        <div class="row-actions">
          <button class="btn quiet" type="button" data-close>Giữ lại</button>
          <button class="btn danger" type="button" id="confirm-delete">Xóa máy chủ</button>
        </div>
      </div>
    </section>
  </div>
  <div class="toast" role="status" aria-live="polite" id="servers-toast"></div>
</main>

<!-- Màn 2: chọn project và danh sách session -->
<main class="device" id="sessions-screen" aria-labelledby="sessions-title">
  <header class="topbar">
    <button class="icon-btn" type="button" aria-label="Quay lại danh sách máy chủ">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 id="sessions-title">Máy công ty<span class="sub">3 project · v1.2.10</span></h1>
    <button class="icon-btn" type="button" aria-label="Làm mới" id="refresh">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a9 9 0 11-3-6.7L21 8M21 3v5h-5"/></svg>
    </button>
  </header>
  <nav class="projects" aria-label="Chọn project">
    <button type="button" aria-pressed="true">~/src/adroidClient</button>
    <button type="button" aria-pressed="false">~/src/LibreChatVT</button>
    <button type="button" aria-pressed="false">~/infra/headscale</button>
  </nav>
  <div class="stale" role="status" id="stale">
    <span>Đang hiện dữ liệu đã lưu, chưa đồng bộ.</span>
    <button type="button" id="sync-now">Đồng bộ</button>
  </div>
  <div class="scroll">
    <ul class="sessions">
      <li class="session">
        <button class="session-main" type="button">
          <span class="t">Sửa lỗi reconnect SSE</span>
          <span class="meta">
            <span class="agent-state busy">Đang chạy</span>
            <span class="pending">1 yêu cầu chờ duyệt</span>
            <span>2 phút trước</span>
          </span>
        </button>
        <button class="icon-btn" type="button" aria-label="Tùy chọn cho session Sửa lỗi reconnect SSE">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
        </button>
      </li>
      <li class="session">
        <button class="session-main" type="button">
          <span class="t">Thêm Roborazzi screenshot test</span>
          <span class="meta"><span class="agent-state retry">Đang thử lại</span><span>14 phút trước</span></span>
        </button>
        <button class="icon-btn" type="button" aria-label="Tùy chọn cho session Thêm Roborazzi screenshot test">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
        </button>
      </li>
      <li class="session">
        <button class="session-main" type="button">
          <span class="t">Rà soát backup rules cho Android 12+</span>
          <span class="meta"><span class="agent-state idle">Rảnh</span><span>Hôm qua, 17:40</span></span>
        </button>
        <button class="icon-btn" type="button" aria-label="Tùy chọn cho session Rà soát backup rules cho Android 12+">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
        </button>
      </li>
      <li class="session">
        <button class="session-main" type="button">
          <span class="t">Keystore invalidation khi đổi khóa màn hình</span>
          <span class="meta"><span class="agent-state idle">Rảnh</span><span>22/09</span></span>
        </button>
        <button class="icon-btn" type="button" aria-label="Tùy chọn cho session Keystore invalidation khi đổi khóa màn hình">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
        </button>
      </li>
    </ul>
    <button class="more-sessions" type="button">Tải thêm session</button>
  </div>
  <div class="toast" role="status" aria-live="polite" id="sessions-toast"></div>
</main>

<script>
  function toast(el, text) {
    el.textContent = text; el.classList.add('show');
    clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 4000);
  }

  // Menu server
  const menu = document.getElementById('server-menu');
  const list = document.getElementById('menu-list');
  const confirmBox = document.getElementById('menu-confirm');
  let opener = null;
  function openMenu(btn) {
    opener = btn;
    const name = btn.dataset.menu;
    document.getElementById('menu-title').textContent = name;
    document.getElementById('confirm-title').textContent = `Xóa “${name}”?`;
    list.hidden = false; confirmBox.hidden = true; menu.hidden = false;
    menu.querySelector('.menu button').focus();
  }
  function closeMenu() { menu.hidden = true; if (opener) opener.focus(); }
  document.querySelectorAll('[data-menu]').forEach((b) => b.addEventListener('click', () => openMenu(b)));
  menu.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', closeMenu));
  document.getElementById('ask-delete').addEventListener('click', () => {
    list.hidden = true; confirmBox.hidden = false; confirmBox.querySelector('.btn.quiet').focus();
  });
  document.getElementById('confirm-delete').addEventListener('click', () => {
    const name = opener.dataset.menu;
    opener.closest('li').remove(); opener = document.querySelector('.fab');
    closeMenu();
    toast(document.getElementById('servers-toast'), `Đã xóa “${name}” khỏi điện thoại.`);
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !menu.hidden) closeMenu(); });

  // Chọn project
  document.querySelectorAll('.projects button').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('.projects button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  }));
  // Đồng bộ
  document.getElementById('sync-now').addEventListener('click', () => {
    document.getElementById('stale').hidden = true;
    toast(document.getElementById('sessions-toast'), 'Đã đồng bộ với máy công ty.');
  });
</script>
</body>
</html>
