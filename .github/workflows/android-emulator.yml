name: Android Emulator Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - app/**
      - gradle/**
      - gradlew
      - gradlew.bat
      - build.gradle.kts
      - settings.gradle.kts
      - .github/workflows/android-emulator.yml
  workflow_dispatch:
    inputs:
      live_opencode:
        description: Run the read-only live OpenCode smoke test with repository secrets
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  offline-emulator:
    name: API 34 instrumented tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm

      - name: Run offline instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.chungjungsoo.gptmobile.OpenCodeCacheInstrumentedTest,dev.chungjungsoo.gptmobile.OpenCodeVaultInstrumentedTest,dev.chungjungsoo.gptmobile.OpenCodeModelPickerInstrumentedTest,dev.chungjungsoo.gptmobile.ApprovedUiUserJourneyInstrumentedTest,dev.chungjungsoo.gptmobile.FigmaBoardVisualInstrumentedTest
            mkdir -p app/build/reports/figma-board
            adb -s emulator-5554 pull /sdcard/googletest/test_outputfiles app/build/reports/figma-board

      - name: Upload Figma board screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: figma-board-screenshots-${{ github.sha }}
          path: app/build/reports/figma-board/

  live-opencode-emulator:
    name: API 34 live OpenCode smoke test
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_opencode }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm

      - name: Run live OpenCode read-only smoke test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          OPENCODE_TEST_URL: https://opencode.hangocthanh.io.vn
          OPENCODE_TEST_USERNAME: opencode
          OPEN_CODE_PASSWORD: ${{ secrets.OPEN_CODE_PASSWORD }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.chungjungsoo.gptmobile.LiveOpenCodeInstrumentedTest -Pandroid.testInstrumentationRunnerArguments.opencode_url="$OPENCODE_TEST_URL" -Pandroid.testInstrumentationRunnerArguments.opencode_username="$OPENCODE_TEST_USERNAME" -Pandroid.testInstrumentationRunnerArguments.opencode_password="$OPEN_CODE_PASSWORD"

      - name: Upload live instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-opencode-test-report-${{ github.sha }}
          path: app/build/reports/androidTests/
